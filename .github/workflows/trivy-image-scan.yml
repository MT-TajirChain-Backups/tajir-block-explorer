name: Trivy image scan & stage

# Builds the image ONCE, scans it (HIGH/CRITICAL gate), and if clean, pushes it
# to DockerHub as tajirchain/tajir-block-explorer:scan-<sha> so the post-merge
# auto-tag workflow can REUSE it (pull + retag) instead of rebuilding.
# Fails on any HIGH/CRITICAL and pings Slack on every gated run.
#
# Triggered only on devnet (PR + direct push), because testnet/mainnet PRs carry
# code that already passed this gate (enforced by require-source-branch.yml).
#
# Requires repo secrets: SLACK_WEBHOOK_URL, DOCKER_USERNAME, DOCKER_PASSWORD.

on:
  pull_request:
    branches: [devnet]
  push:
    branches: [devnet]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to comment the staged image tag on the PR

env:
  DOCKERHUB_IMAGE: tajirchain/tajir-block-explorer
  # The exact commit whose code is in the image. For PRs we must use head.sha —
  # after merge, the merge commit SHA won't exist on the branch yet at scan time,
  # and post-merge the auto-tag workflow will look this same SHA up.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve image tag
        id: meta
        run: |
          echo "tag=${DOCKERHUB_IMAGE}:scan-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Staging image as: ${DOCKERHUB_IMAGE}:scan-${SOURCE_SHA}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true

      - name: Build image
        # --no-cache ensures prior vulnerable node_modules layers cannot survive
        run: docker build --no-cache -t "${{ steps.meta.outputs.tag }}" .

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.71.0
          wget -qO /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan (report)
        run: |
          trivy image --severity HIGH,CRITICAL --scanners vuln \
            --format table --output trivy-report.txt --exit-code 0 "${{ steps.meta.outputs.tag }}"

      - name: Trivy JSON paths for remaining findings
        if: always()
        run: |
          trivy image --severity HIGH,CRITICAL --scanners vuln \
            --format json --output /tmp/trivy.json "${{ steps.meta.outputs.tag }}" || true
          node -e '
            const fs=require("fs");
            let d; try{d=JSON.parse(fs.readFileSync("/tmp/trivy.json","utf8"))}catch{console.log("no json"); process.exit(0)}
            for (const r of d.Results||[]) {
              for (const v of r.Vulnerabilities||[]) {
                console.log([v.Severity,v.PkgName,v.InstalledVersion,v.VulnerabilityID,v.PkgPath||r.Target].join("\t"));
              }
            }
          '

      - name: Publish findings to Job Summary
        if: always()
        run: |
          {
            echo "## Trivy HIGH/CRITICAL — ${{ github.repository }} @ ${SOURCE_SHA::7}"
            echo '```'
            cat trivy-report.txt || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      # Gate: re-scan with exit-code 1. continue-on-error so the notify + explicit
      # fail below still run. DB is cached from the report step, so this is fast.
      - name: Trivy gate
        id: gate
        continue-on-error: true
        run: |
          trivy image --severity HIGH,CRITICAL --scanners vuln --exit-code 1 "${{ steps.meta.outputs.tag }}"

      - name: Notify Slack on findings
        if: steps.gate.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"🛡️ *Trivy: HIGH/CRITICAL in ${REPO}* (ref \`${REF}\`, sha \`${SOURCE_SHA::7}\`)\n🔗 ${RUN_URL}\"}" \
            "${SLACK_WEBHOOK_URL}" || true

      - name: Fail if findings
        if: steps.gate.outcome == 'failure'
        run: |
          echo "HIGH/CRITICAL vulnerabilities present — see Job Summary." >&2
          exit 1

      # ── Stage the scanned image for reuse by auto-tag.yml ────────────────────
      - name: Login to DockerHub
        if: steps.gate.outcome == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push staged image
        if: steps.gate.outcome == 'success'
        run: |
          docker push "${{ steps.meta.outputs.tag }}"
          echo "Staged image: ${{ steps.meta.outputs.tag }}"

      - name: Comment staged image on PR
        if: steps.gate.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="🐳 Image built & scanned (HIGH/CRITICAL clean) and staged as \`${{ steps.meta.outputs.tag }}\`. It will be promoted as-is on merge — no rebuild."
          ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("🐳 Image built")) | .id' | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi